<script>
  // Set current year
  document.getElementById("y").textContent = new Date().getFullYear();

  (function () {
    try {
      const path = window.location.pathname;

      // Ignore non-learning pages
      const ignorePaths = [
        "/",
        "/about/",
        "/contact/",
        "/learning-paths/"
      ];

      // Save last meaningful page
      if (!ignorePaths.includes(path)) {
        localStorage.setItem("esa:lastPage", path);
        localStorage.setItem("esa:lastSeen", new Date().toISOString());
      }

      // Convert URL to readable label
      function getLabel(url) {
        const parts = url.split("/").filter(Boolean);
        if (parts.length === 0) return "Home";

        let name = parts[0];

        // Replace hyphens with spaces
        name = name.replace(/-/g, " ");

        // Capitalize
        name = name.charAt(0).toUpperCase() + name.slice(1);

        return name;
      }

      // Continue Learning button
      const last = localStorage.getItem("esa:lastPage");
      const btn = document.getElementById("continueBtn");

      if (last && btn && last !== "/") {
        btn.href = last;

        const label = getLabel(last);
        btn.textContent = "Continue: " + label;

        btn.style.display = "inline-block";
      }

    } catch (e) {
      // Silent fail (safe)
    }
  })();
</script>
