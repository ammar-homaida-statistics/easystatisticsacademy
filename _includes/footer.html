<script>
  // Set current year
  document.getElementById("y").textContent = new Date().getFullYear();

  (function () {
    try {
      const path = window.location.pathname;

      // Pages we DON'T want to track
      const ignorePaths = [
        "/",
        "/about/",
        "/contact/",
        "/learning-paths/"
      ];

      // Save last meaningful page
      if (!ignorePaths.includes(path)) {
        localStorage.setItem("esa:lastPage", path);
        localStorage.setItem("esa:lastSeen", new Date().toISOString());
      }

      // Attach "Continue Learning" button
      const last = localStorage.getItem("esa:lastPage");
      const btn = document.getElementById("continueBtn");

      if (last && btn) {
        btn.href = last;
        btn.style.display = "inline-block";
      }

    } catch (e) {
      // Fail silently (important for robustness)
    }
  })();
</script>
