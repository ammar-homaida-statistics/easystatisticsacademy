<script>
  // Keep reading history restricted to actual learning content, not landing pages.
  (function () {
    const year = document.getElementById("y");
    if (year) year.textContent = new Date().getFullYear();

    // Require a topic/block/lesson below a known educational section.
    const learningRoute = /^\/(?:foundations|descriptive|probability|inference|modeling|applied-statistics|mathematical-statistics|machine-learning|data-mining|artificial-intelligence|software)(?:\/[a-z0-9-]+)+\/$/;
    const path = window.location.pathname;
    if (!learningRoute.test(path)) return;

    try {
      localStorage.setItem("esa:lastPage", path);
      localStorage.setItem("esa:lastSeen", new Date().toISOString());
      const heading = document.querySelector("main h1");
      const title = heading ? heading.textContent.trim().slice(0, 120) : "";
      localStorage.setItem("esa:lastTitle", title);
    } catch (e) {
      // Storage may be disabled; navigation and learning content still work.
    }
  })();
</script>
