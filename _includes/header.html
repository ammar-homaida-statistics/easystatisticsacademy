<header class="site-header">

  <div class="container">

    <!-- ===== TOP ROW ===== -->
    <div class="header-top">

      <!-- BRAND -->
      <a class="brand" href="/">
        <img src="/images/brand/logo.png?v=2" alt="EasyStatisticsAcademy" />
        <span class="brand-text">EasyStatisticsAcademy</span>
      </a>

      <!-- LANGUAGE NAVIGATION: show only real translation pairs -->
      <nav aria-label="Language selection" style="display:flex;gap:.6rem;align-items:center">
        {% if page.translation_pair == "bootstrap" %}
          <a href="/inference/assumptions-robustness/bootstrap-as-robust-tool/" lang="en" dir="ltr">English</a>
          <a href="/ar/inference/assumptions-robustness/bootstrap-as-robust-tool/" lang="ar" dir="rtl">العربية</a>
        {% elsif page.lang == "ar" %}
          <a href="/" lang="en" dir="ltr">English</a>
          <a href="/ar/" lang="ar" dir="rtl">العربية</a>
        {% else %}
          <a href="/ar/" lang="ar" dir="rtl">العربية</a>
        {% endif %}
      </nav>
      <!-- SEARCH -->
      <div class="header-search">
        <label class="sr-only" for="site-search">Search statistical lessons</label>
        <input 
          id="site-search"
          type="search"
          placeholder="Search topics…"
          autocomplete="off"
          aria-controls="search-results"
          aria-describedby="search-status"
        />
        <div id="search-results" class="search-results" role="region" aria-label="Search results" hidden></div>
        <p id="search-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      </div>

      <!-- MOBILE TOGGLE -->
      <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-controls="site-primary-nav" aria-expanded="false">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>

    </div>

    <!-- ===== BOTTOM ROW ===== -->
    <div class="header-bottom">

      <nav id="site-primary-nav" class="nav" aria-label="Primary navigation">

        <a href="/"{% if page.url == '/' %} class="is-active" aria-current="page"{% endif %}>Home</a>

        <a href="/learning-paths/beginner/"{% if page.url == '/learning-paths/beginner/' %} class="is-active" aria-current="page"{% endif %}>Beginner</a>
        <a href="/learning-paths/intermediate/"{% if page.url == '/learning-paths/intermediate/' %} class="is-active" aria-current="page"{% endif %}>Intermediate</a>
        <a href="/learning-paths/advanced/"{% if page.url == '/learning-paths/advanced/' %} class="is-active" aria-current="page"{% endif %}>Advanced</a>

        <a href="/learning-paths/"{% if page.url == '/learning-paths/' %} class="is-active" aria-current="page"{% endif %}>Paths</a>

        <a href="/about/"{% if page.url == '/about/' %} class="is-active" aria-current="page"{% endif %}>About</a>

      </nav>

    </div>

  </div>

</header>
