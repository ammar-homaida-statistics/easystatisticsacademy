name: Jekyll check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Validate YAML and build GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test mathematical placeholder validator
        run: python -m unittest discover -s .github/scripts -p 'test_math_placeholders.py' -v
      - name: Inventory mathematical placeholders and reject new damage
        run: python .github/scripts/validate_math_placeholders.py
      - name: Validate front matter
        run: |
          python -m pip install PyYAML==6.0.3
          python .github/scripts/validate_front_matter.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.6.9'
          bundler-cache: true
      - name: Show locked dependency versions
        run: cat Gemfile.lock
      - name: Build website
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec jekyll build --strict_front_matter --trace
      - name: Check search template edge cases
        run: bundle exec ruby .github/scripts/test_search_template.rb
      - name: Install search test browser
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Check generated search, CSS assets, and browser behavior
        run: python .github/scripts/test_search.py --site _site
