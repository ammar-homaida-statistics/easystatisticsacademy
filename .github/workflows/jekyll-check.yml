name: Jekyll check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Validate YAML and build GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test mathematical placeholder validator
        run: python -m unittest discover -s .github/scripts -p 'test_math_placeholders.py' -v
      - name: Verify Batch #63 independent probability benchmarks
        run: python -m unittest discover -s .github/scripts -p 'test_batch63_math.py' -v
      - name: Verify Batch #64 independent distribution benchmarks
        run: python -m unittest discover -s .github/scripts -p 'test_batch64_math.py' -v
      - name: Verify Batch #65 independent Exponential and ANOVA benchmarks
        run: python -m unittest discover -s .github/scripts -p 'test_batch65_math.py' -v
      - name: Verify Batch #66 independent Gamma and Pearson reference benchmarks
        run: python -m unittest discover -s .github/scripts -p 'test_batch66_math.py' -v
      - name: Verify Batch #67 independent Beta and Homogeneity benchmarks
        run: python -m unittest discover -s .github/scripts -p 'test_batch67_math.py' -v
      - name: Verify Batch #68 independent Uniform and paired-t reference benchmarks
        run: python -m unittest discover -s .github/scripts -p 'test_batch68_math.py' -v
      - name: Verify Batch #69 independent Normal and Welch benchmarks
        run: python -m unittest discover -s .github/scripts -p 'test_batch69_math.py' -v
      - name: Verify Batch #70 independent Lognormal and two-proportion benchmarks
        run: python -m unittest discover -s .github/scripts -p 'test_batch70_math.py' -v
      - name: Verify Batch #71 independent Hypergeometric and Wilson/Wald benchmarks
        run: python -m unittest discover -s .github/scripts -p 'test_batch71_math.py' -v
      - name: Verify Batch #72 independent Bernoulli and Student t benchmarks
        run: python -m unittest discover -s .github/scripts -p 'test_batch72_math.py' -v
      - name: Verify Batch #73 independent conditional and known-sigma Z benchmarks
        run: python -m unittest discover -s .github/scripts -p 'test_batch73_math.py' -v
      - name: Verify Batch #74 independent partition and multiple-testing references
        run: python -m unittest discover -s .github/scripts -p 'test_batch74_math.py' -v
      - name: Inventory mathematical placeholders and reject new damage
        run: python .github/scripts/validate_math_placeholders.py
      - name: Validate front matter
        run: |
          python -m pip install PyYAML==6.0.3
          python .github/scripts/validate_front_matter.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.6.9'
          bundler-cache: true
      - name: Show locked dependency versions
        run: cat Gemfile.lock
      - name: Build website
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec jekyll build --strict_front_matter --trace
      - name: Check search template edge cases
        run: bundle exec ruby .github/scripts/test_search_template.rb
      - name: Test generated-site link auditor
        run: python -m unittest discover -s .github/scripts -p 'test_internal_links.py' -v
      - name: Report internal links and missing anchors
        run: python .github/scripts/audit_internal_links.py --site _site --baseline .github/internal-link-baseline.json --max-reported 35
      - name: Test generated-site SEO auditor
        run: python -m unittest discover -s .github/scripts -p 'test_seo.py' -v
      - name: Report SEO metadata and indexability issues
        run: python .github/scripts/audit_seo.py --site _site --baseline .github/seo-baseline.json --max-reported 45
      - name: Install search test browser
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Check generated search, CSS assets, and browser behavior
        run: python .github/scripts/test_search.py --site _site
