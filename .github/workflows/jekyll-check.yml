name: Jekyll check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Validate YAML and build GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate front matter
        run: |
          python -m pip install PyYAML==6.0.3
          python .github/scripts/validate_front_matter.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.6.9'
          bundler-cache: true
      - name: Show locked dependency versions
        run: cat Gemfile.lock
      - name: Build website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --trace
